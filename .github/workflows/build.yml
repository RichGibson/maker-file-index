name: Build Executables

# Builds standalone binaries for macOS and Windows.
# Triggered automatically on version tags (v*.*.*) and can also
# be run manually from the Actions tab.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write  # required to create/update GitHub Releases
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: maker-file-index-macos
            binary_path: dist/maker-file-index
          - os: windows-latest
            artifact_name: maker-file-index-windows
            binary_path: dist/maker-file-index.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and build dependencies
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller maker-file-index.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}

      # Only publish to the GitHub Release when triggered by a tag push
      - name: Attach binary to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.binary_path }}
